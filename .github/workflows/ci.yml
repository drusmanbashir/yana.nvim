{
  "name": "CI",
  "on": {
    "pull_request": {},
    "push": {
      "branches": [
        "main"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "release-tree": {
      "runs-on": "ubuntu-24.04",
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
        },
        {
          "name": "System dependencies",
          "run": "sudo apt-get update && sudo apt-get install -y bubblewrap libcap2-bin apparmor"
        },
        {
          "name": "Permit Bubblewrap namespaces on the disposable runner",
          "shell": "bash",
          "run": "set -euo pipefail\nsysctl kernel.apparmor_restrict_unprivileged_userns\nprobe=(bwrap --unshare-user --unshare-pid --die-with-parent --ro-bind / / --dev /dev --proc /proc --uid \"$(id -u)\" --gid \"$(id -g)\" -- true)\nset +e\n\"${probe[@]}\"\nbefore=$?\nset -e\nprintf 'Bubblewrap namespace probe before profile: rc=%s\\n' \"$before\"\nif grep -rl /usr/bin/bwrap /etc/apparmor.d/; then\n  echo \"Using the existing Bubblewrap AppArmor profile\"\nelse\nprintf '%s\\n' 'abi <abi/4.0>,' 'include <tunables/global>' 'profile yana-bwrap /usr/bin/bwrap flags=(unconfined) {' '  userns,' '}' | sudo tee /etc/apparmor.d/yana-bwrap\nsudo apparmor_parser -r /etc/apparmor.d/yana-bwrap\nfi\n\"${probe[@]}\"\nsysctl kernel.apparmor_restrict_unprivileged_userns\nprintf 'Bubblewrap namespace probe after profile: rc=0\\n'"
        },
        {
          "name": "Verify public tree",
          "run": "scripts/release/verify.sh ."
        },
        {
          "name": "Fresh Neovim matrix",
          "shell": "bash",
          "run": "set -euo pipefail\nexport YANA_HEADLESS_TMPDIR=\"$RUNNER_TEMP/yana-headless\"\nmkdir -p \"$YANA_HEADLESS_TMPDIR\"\ncase $YANA_HEADLESS_TMPDIR in /tmp|/tmp/*) echo \"YANA_HEADLESS_TMPDIR must lie outside /tmp\" >&2; exit 1;; esac\nfor version in 0.10.4 0.11.2 0.12.4; do\n  bin=$(scripts/release/install-neovim.sh \"$version\" \"$RUNNER_TEMP/nvim-$version\" | tail -1)\n  if [[ $version == 0.10.4 ]]; then\n    tests/release/fresh_install.sh . \"$bin\" --expect-refusal\n  else\n    tests/release/fresh_install.sh . \"$bin\"\n  fi\ndone"
        },
        {
          "name": "Release policy mutations",
          "run": "tests/release/policy_mutation_gate.sh ."
        },
        {
          "name": "Public helpers",
          "shell": "bash",
          "run": "set -euo pipefail\nbin=$(scripts/release/install-neovim.sh 0.12.4 \"$RUNNER_TEMP/nvim-helpers\" | tail -1)\ntests/release/helper_gate.sh . \"$bin\""
        },
        {
          "name": "Dependency failure paths",
          "shell": "bash",
          "run": "set -euo pipefail\nbin=$(scripts/release/install-neovim.sh 0.12.4 \"$RUNNER_TEMP/nvim-deps\" | tail -1)\ntests/release/dependency_gate.sh . \"$bin\""
        },
        {
          "name": "Pinned blink.cmp adapters",
          "shell": "bash",
          "run": "set -euo pipefail\ngit clone --filter=blob:none https://github.com/saghen/blink.cmp.git \"$RUNNER_TEMP/blink.cmp\"\ngit -C \"$RUNNER_TEMP/blink.cmp\" checkout --detach 78336bc89ee5365633bcf754d93df01678b5c08f\nbin=$(scripts/release/install-neovim.sh 0.12.4 \"$RUNNER_TEMP/nvim-blink\" | tail -1)\ntests/release/blink_gate.sh . \"$bin\" \"$RUNNER_TEMP/blink.cmp\""
        }
      ]
    }
  }
}
